name: angle-ios-moltenvk-device

on:
  push:
    branches: [main]
    paths:
      - 'gni/angle.gni'
      - 'src/common/vulkan/**'
      - '.github/workflows/angle-ios-moltenvk-device.yml'
  workflow_dispatch:
    inputs:
      moltenvk_tag:
        description: 'MoltenVK release tag'
        default: 'v1.3.0'
        required: false

jobs:
  build-ios-device:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup depot_tools + gclient sync
        run: |
          set -e
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git ../depot_tools
          export PATH="$PWD/../depot_tools:$PATH"
          echo "$PWD/../depot_tools" >> $GITHUB_PATH
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://chromium.googlesource.com/angle/angle",
              "deps_file": "DEPS",
              "managed": False,
            },
          ]
          EOF
          gclient sync --no-history --noprehooks
          gn --version
          ninja --version || autoninja --version

      - name: Patch vulkan-loader for iOS (MoltenVK-only)
        run: |
          set -e
          LOADER=third_party/vulkan-loader/src/loader/loader.c
          test -f "$LOADER"
          # Khronos loader only defines these on Linux; on iOS they are dead
          # code (ANGLE dlopens MoltenVK directly), just needs to compile.
          python3 - "$LOADER" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          guard = '#ifndef FALLBACK_CONFIG_DIRS\n#define FALLBACK_CONFIG_DIRS "/etc/xdg"\n#endif\n#ifndef FALLBACK_DATA_DIRS\n#define FALLBACK_DATA_DIRS "/usr/local/share:/usr/share"\n#endif\n#ifndef SYSCONFDIR\n#define SYSCONFDIR "/etc"\n#endif\n'
          if 'ifndef FALLBACK_CONFIG_DIRS' not in s:
              s = guard + s
              open(p, 'w').write(s)
              print('patched', p)
          else:
              print('already patched')
          EOF
          grep -n "FALLBACK_CONFIG_DIRS\|FALLBACK_DATA_DIRS\|define SYSCONFDIR" "$LOADER" | head

      - name: GN gen iOS device arm64 (Vulkan-only, Metal disabled)
        run: |
          export PATH="$PWD/../depot_tools:$PATH"
          # gni/angle.gni 已强制: metal=false, vulkan含is_ios，这里再显式覆盖一次防回退
          gn gen out/ios-device --args='target_os="ios" target_cpu="arm64" target_environment="device" is_debug=false is_component_build=false ios_enable_code_signing=false ios_deployment_target="16.0" angle_enable_metal=false angle_enable_vulkan=true angle_enable_gl=false angle_enable_null=false angle_enable_wgpu=false angle_enable_msl=false angle_enable_swiftshader=false angle_enable_vulkan_validation_layers=false angle_enable_vulkan_api_dump_layer=false is_official_build=true chrome_pgo_phase=0 symbol_level=0'
          gn args out/ios-device --list | grep -E "target_|angle_enable_vulkan|angle_enable_metal" || true

      - name: Build libEGL libGLESv2
        run: |
          export PATH="$PWD/../depot_tools:$PATH"
          autoninja -C out/ios-device libEGL libGLESv2
          ls -lh out/ios-device/*.framework
          lipo -info out/ios-device/libEGL.framework/libEGL
          lipo -info out/ios-device/libGLESv2.framework/libGLESv2

      - name: Fetch MoltenVK xcframework
        run: |
          TAG="${{ inputs.moltenvk_tag }}"
          if [ -z "$TAG" ]; then TAG="v1.3.0"; fi
          echo "MoltenVK tag=$TAG"
          curl -L -o mvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/${TAG}/MoltenVK.xcframework.tar"
          tar xf mvk.tar
          ls -R MoltenVK.xcframework | head -n 30

      - name: Package frameworks
        run: |
          rm -rf package/device && mkdir -p package/device
          cp -R out/ios-device/libEGL.framework package/device/
          cp -R out/ios-device/libGLESv2.framework package/device/
          # Extract iOS device MoltenVK.framework from xcframework (ios-arm64 slice)
          ls MoltenVK.xcframework/
          if [ -d "MoltenVK.xcframework/ios-arm64/MoltenVK.framework" ]; then
            cp -R MoltenVK.xcframework/ios-arm64/MoltenVK.framework package/device/
          else
            MVK_FW=$(find MoltenVK.xcframework -maxdepth 2 -type d -name "MoltenVK.framework" | grep -v -i simulator | head -n 1)
            echo "fallback MoltenVK slice: $MVK_FW"
            test -n "$MVK_FW"
            cp -R "$MVK_FW" package/device/
          fi
          mkdir -p package/include
          cp -R include/EGL include/GLES2 include/GLES3 include/KHR package/include/
          ls -lh package/device/
          lipo -info package/device/libEGL.framework/libEGL
          lipo -info package/device/libGLESv2.framework/libGLESv2
          lipo -info package/device/MoltenVK.framework/MoltenVK

      - uses: actions/upload-artifact@v4
        with:
          name: angle-ios-device-moltenvk
          path: |
            package/device/libEGL.framework
            package/device/libGLESv2.framework
            package/device/MoltenVK.framework
            package/include/
