# 构建适用于 iOS 真机的 Metal 后端 ANGLE .framework (ad-hoc 版)
# (开发版: 由 build-ios-device-metal.yml 复制, ad-hoc 相关开发在此文件上进行, 原文件不动)
#
# 与原版的区别: Build 后对两个 framework 执行 codesign -s - (正规 CS_ADHOC 标志),
# 使其满足 dyld 最低加载要求, 可直接放入 TrollStore 签名的 App 使用。
# 注意: 不要用 Homebrew ldid 代替 (其 flags=0x0 会被判为无签名);
# 不要给 framework 加 entitlements (Apple 规定 framework 不得含 entitlements)。
#
# 用法: GitHub 网页 -> Actions -> 本 workflow -> Run workflow,
# 构建完成后在 Artifacts 里下载 libEGL.framework / libGLESv2.framework。
#
# 注意: iOS 构建只能在 macOS runner (GitHub 提供的 macos 云主机) 上跑,
# 这是 Xcode/iOS SDK 的限制,改不了。

name: Build ANGLE iOS Device (Metal, adhoc-dev)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: |
          python3 scripts/bootstrap.py
          gclient sync --no-history --noprehooks

      - name: GN gen (iOS device / arm64 / Metal)
        run: |
          mkdir -p out/ios-device
          cat > out/ios-device/args.gn <<'EOF'
          target_os = "ios"
          target_cpu = "arm64"
          target_environment = "device"
          ios_deployment_target = "15.0"
          ios_enable_code_signing = false
          is_debug = false
          is_component_build = false
          symbol_level = 0
          angle_enable_metal = true
          angle_enable_vulkan = false
          angle_enable_gl = false
          angle_enable_null = false
          angle_enable_wgpu = false
          angle_build_tests = false
          EOF
          gn gen out/ios-device

      - name: Build frameworks
        run: autoninja -C out/ios-device libEGL libGLESv2

      - name: Ad-hoc re-sign frameworks (codesign -s -)
        run: |
          set -e
          # TrollStore/侧载场景: framework 至少需要 ad-hoc 签名才能被 dyld 加载。
          # 必须用 codesign -s - (正规 CS_ADHOC 标志), 不能用 Homebrew ldid;
          # 不加 entitlements (framework 不得含 entitlements)。
          codesign --force --sign - out/ios-device/libEGL.framework
          codesign --force --sign - out/ios-device/libGLESv2.framework

      - name: Verify signatures + architectures
        run: |
          set -e
          # 确认 adhoc 标志存在 (codesign -dv 输出含 Signature=adhoc)
          codesign -dv out/ios-device/libEGL.framework 2>&1 | grep -i adhoc
          codesign -dv out/ios-device/libGLESv2.framework 2>&1 | grep -i adhoc
          lipo -info out/ios-device/libEGL.framework/libEGL
          lipo -info out/ios-device/libGLESv2.framework/libGLESv2

      - name: Upload frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-iOS-device-frameworks-adhoc
          path: out/ios-device/*.framework
